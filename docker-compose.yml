version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: stock-trading-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - stock-trading-network

volumes:
  mongodb_data:

networks:
  stock-trading-network:
    driver: bridge
